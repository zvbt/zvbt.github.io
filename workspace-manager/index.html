<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Workspaces Manager</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="logo">Workspaces Manager</div>
        <div class="workspaces" id="workspaces"></div>
        <button class="add" onclick="openWorkspaceModal()">
          + New workspace
        </button>
      </aside>
      <main class="main">
        <div class="header">
          <div>
            <div class="title" id="title"></div>
            <div class="subtitle" id="subtitle"></div>
          </div>
          <div class="actions">
            <button onclick="importJSON()">Import</button>
            <button onclick="exportJSON()">Export</button>
            <button class="primary" onclick="openLinkModal()">
              + Add link
            </button>
            <select id="theme-select">
              <option value="default">Default Theme</option>
              <option value="blood-moon">Blood Moon</option>
              <option value="catppuccin-mocha">Catppuccin Mocha</option>
              <option value="cyberpunk">Cyberpunk</option>
              <option value="dracula">Dracula</option>
              <option value="everforest">Everforest</option>
              <option value="gruvbox">Gruvbox Dark</option>
              <option value="kanagawa">Kanagawa</option>
              <option value="rosepine">Rose Pine</option>
              <option value="tokyonight">Tokyo Night</option>
            </select>
          </div>
        </div>
        <div class="links" id="links"></div>
      </main>
    </div>
    <input
      id="jsonFile"
      type="file"
      accept=".json,application/json"
      hidden
      onchange="handleImport(this)"
    />

    <div class="modal" id="workspaceModal">
      <div class="dialog">
        <h2>New workspace</h2>
        <div class="field">
          <label>Name</label
          ><input id="workspaceName" placeholder="e.g. Work, Gaming, School" />
        </div>
        <div class="field">
          <label>Icon <span class="optional">(optional)</span></label>
          <div class="icon-mode-tabs">
            <button
              type="button"
              class="icon-mode-tab active"
              id="iconModeIconBtn"
              onclick="setIconMode('icon')"
            >
              FontAwesome
            </button>
            <button
              type="button"
              class="icon-mode-tab"
              id="iconModeUrlBtn"
              onclick="setIconMode('url')"
            >
              Image URL
            </button>
          </div>
          <div id="iconModeIconPanel">
            <button
              type="button"
              class="icon-picker-toggle"
              id="iconPickerToggle"
              onclick="toggleIconPicker()"
            >
              <span class="icon-preview" id="iconPreview"
                ><i class="fa-solid fa-shapes"></i
              ></span>
              <span id="iconPickerLabel">Choose icon</span>
              <i
                class="fa-solid fa-chevron-down"
                style="margin-left: auto; font-size: 12px; opacity: 0.6"
              ></i>
            </button>
            <div class="icon-grid" id="iconGrid" hidden>
              <input
                id="iconSearch"
                placeholder="Search icons..."
                oninput="renderIconGrid()"
              />
              <div class="icon-grid-items" id="iconGridItems"></div>
            </div>
          </div>
          <div id="iconModeUrlPanel" hidden>
            <input
              id="workspaceIconUrl"
              placeholder="https://example.com/icon.png"
            />
          </div>
        </div>
        <div class="modal-actions">
          <button onclick="closeModals()">Cancel</button
          ><button class="primary" onclick="createWorkspace()">Create</button>
        </div>
      </div>
    </div>

    <div class="modal" id="linkModal">
      <div class="dialog">
        <h2>Add link</h2>
        <div class="field">
          <label>Name</label><input id="linkName" placeholder="e.g. GitHub" />
        </div>
        <div class="field">
          <label>URL</label
          ><input id="linkUrl" placeholder="https://example.com" />
        </div>
        <div class="modal-actions">
          <button onclick="closeModals()">Cancel</button
          ><button class="primary" onclick="createLink()">Add link</button>
        </div>
      </div>
    </div>

    <script src="./workspace.js"></script>
    <script src="./theme.js"></script>
  </body>
</html>
